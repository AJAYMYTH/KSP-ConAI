          document.documentElement.classList.remove('lang-kn-active');
        }

rcle-alert w-5 h-5"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg> </div> <div> <span class="text-[10px] uppercase tracking-wider text-steel font-bold">KSP-ConAI Compliance</span> <h1 class="text-xl font-bold text-ink-deep"> <span class="lang-en">Usage & Intelligence Disclaimer</span> <span class="lang-kn">ಬಳಕೆ ಮತ್ತು ಗುಪ್ತಚರ ಹಕ್ಕುತ್ಯಾಗ</span> </h1> </div> </div> <div class="text-[11px] text-stone font-medium"> <span class="lang-en">Last Updated: July 2026 | Authority: Karnataka State Police Director General</span> <span class="lang-kn">ಕೊನೆಯದಾಗಿ ನವೀಕರಿಸಿದ್ದು: ಜುಲೈ 2026 | ಪ್ರಾಧಿಕಾರ: ಕರ್ನಾಟಕ ರಾಜ್ಯ ಪೊಲೀಸ್ ಮಹಾನಿರ್ದೇಶಕರು</span> </div> <div class="space-y-5 text-xs text-steel leading-relaxed"> <section class="space-y-2"> <h2 class="text-sm font-bold text-ink-deep"> <span class="lang-en">1. Advisory Nature of AI Tools</span> <span class="lang-kn">1. AI ಪರಿಕರಗಳ ಸಲಹಾತ್ಮಕ ಸ್ವರೂಪ</span> </h2> <p class="lang-en">
The Karnataka State Police Crime Intelligence Copilot (KSP-ConAI) utilizes Large Language Models (LLMs), machine learning algorithms, and natural language processing to assist officers in analyzing Case Narrative Diaries, establishing suspect timelines, and generating suspect relationship graphs.
</p> <p class="lang-kn">
ಕರ್ನಾಟಕ ರಾಜ್ಯ ಪೊಲೀಸ್ ಅಪರಾಧ ಗುಪ್ತಚರ ಸಹಾಯಕ (KSP-ConAI) ಪ್ರಕಟಿತ ಕೇಸ್ ಡೈರಿಗಳನ್ನು ವಿಶ್ಲೇಷಿಸಲು, ಆರೋಪಿಗಳ ಟೈಮ್‌ಲೈನ್‌ಗಳನ್ನು ಸ್ಥಾಪಿಸಲು ಮತ್ತು ಆರೋಪಿಗಳ ಸಂಬಂಧ ನಕ್ಷೆಗಳನ್ನು ರಚಿಸಲು ಕೃತಕ ಬುದ್ಧಿಮತ್ತೆ ಮತ್ತು ನೈಸರ್ಗಿಕ ಭಾಷಾ ಸಂಸ್ಕರಣೆಯನ್ನು ಬಳಸಿಕೊಳ್ಳುತ್ತದೆ.
</p> <p class="font-bold text-ink-deep lang-en">
All AI-generated summaries, chat responses, and relationship links are advisory in nature. They do NOT constitute official legal testimony, final evidence, or deterministic assertions of guilt.
</p> <p class="font-bold text-ink-deep lang-kn">
ಎಲ್ಲಾ AI-ರಚಿತ ಸಾರಾಂಶಗಳು, ಚಾಟ್ ಪ್ರತಿಕ್ರಿಯೆಗಳು ಮತ್ತು ಸಂಬಂಧದ ಕೊಂಡಿಗಳು ಕೇವಲ ಸಲಹಾತ್ಮಕ ಸ್ವರೂಪದ್ದಾಗಿರುತ್ತವೆ. ಅವು ಅಧಿಕೃತ ಕಾನೂನು ಸಾಕ್ಷ್ಯ, ಅಂತಿಮ ಸಾಕ್ಷ್ಯ ಅಥವಾ ಅಪರಾಧದ ನಿರ್ಣಾಯಕ ಪ್ರತಿಪಾದನೆಗಳನ್ನು ರೂಪಿಸುವುದಿಲ್ಲ.
</p> </section> <section class="space-y-2"> <h2 class="text-sm font-bold text-ink-deep"> <span class="lang-en">2. Officer Verification Requirement</span> <span class="lang-kn">2. ಅಧಿಕಾರಿಯ ಪರಿಶೀಲನೆಯ ಅವಶ್ಯಕತೆ</span> </h2> <p class="lang-en">
Investigating Officers (IOs) bear sole legal responsibility for the accuracy and validity of their case files. All intelligence outputs produced by KSP-ConAI must be:
</p> <p class="lang-kn">
ತನಿಖಾಧಿಕಾರಿಗಳು (IOs) ತಮ್ಮ ಪ್ರಕರಣದ ಕಡತಗಳ ನಿಖರತೆ ಮತ್ತು ಸಿಂಧುತ್ವಕ್ಕೆ ಸಂಪೂರ್ಣ ಕಾನೂನು ಜವಾಬ್ದಾರಿಯನ್ನು ಹೊಂದಿರುತ್ತಾರೆ. KSP-ConAI ನಿಂದ ಉತ್ಪಾದಿಸಲ್ಪಟ್ಟ ಎಲ್ಲಾ ಗುಪ್ತಚರ ಮಾಹಿತಿಯನ್ನು ಅಧಿಕಾರಿಗಳು:
</p> <ul class="list-disc pl-5 space-y-1"> <li class="lang-en">Cross-checked against the official signed paper Case Diaries and CCTNS records.</li> <li class="lang-kn">ಅಧಿಕೃತ ಸಹಿ ಮಾಡಿದ ಕೇಸ್ ಡೈರಿಗಳು ಮತ್ತು CCTNS ದಾಖಲೆಗಳೊಂದಿಗೆ ಕ್ರಾಸ್-ವೆರಿಫೈ ಮಾಡಬೇಕು.</li> <li class="lang-en">Verified with original witness statements and forensic reports before submission to a court of law.</li> <li class="lang-kn">ನ್ಯಾಯಾಲಯಕ್ಕೆ ಸಲ್ಲಿಸುವ ಮುನ್ನ ಮೂಲ ಸಾಕ್ಷಿ ಹೇಳಿಕೆಗಳು ಮತ್ತು ಫೋರೆನ್ಸಿಕ್ ವರದಿಗಳೊಂದಿಗೆ ಪರಿಶೀಲಿಸಬೇಕು.</li> <li class="lang-en">Confirmed for accuracy in names, dates, sections, and recovery amounts.</li> <li class="lang-kn">ಹೆಸರುಗಳು, ದಿನಾಂಕಗಳು, ಸೆಕ್ಷನ್‌ಗಳು ಮತ್ತು ವಶಪಡಿಸಿಕೊಂಡ ಮೊತ್ತಗಳ ನಿಖರತೆಯನ್ನು ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಬೇಕು.</li> </ul> </section> <section class="space-y-2"> <h2 class="text-sm font-bold text-ink-deep"> <span class="lang-en">3. Geolocation and Mapping Limitations</span> <span class="lang-kn">3. ಜಿಯೋಲೋಕಲೈಸೇಶನ್ ಮತ್ತು ಮ್ಯಾಪಿಂಗ್ ಮಿತಿಗಳು</span> </h2> <p class="lang-en">
Hotspots maps, cluster zones, and coordinate pins rendered on this platform are based on available address texts and mobile tower records. They represent statistical approximations rather than exact physical locations. Discrepancies in street maps or boundaries should be resolved using official municipal records.
</p> <p class="lang-kn">
ಈ ವೇದಿಕೆಯಲ್ಲಿ ನಿರೂಪಿಸಲಾದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ನಕ್ಷೆಗಳು, ಕ್ಲಸ್ಟರ್ ವಲಯಗಳು ಮತ್ತು ನಿರ್ದೇಶಾಂಕ ಪಿನ್‌ಗಳು ಲಭ್ಯವಿರುವ ವಿಳಾಸ ಪಠ್ಯಗಳು ಮತ್ತು ಮೊಬೈಲ್ ಟವರ್ ದಾಖಲೆಗಳನ್ನು ಆಧರಿಸಿವೆ. ಅವು ನಿಖರವಾದ ಭೌತಿಕ ಸ್ಥಳಗಳಿಗಿಂತ ಹೆಚ್ಚಾಗಿ ಅಂಕಿಅಂಶಗಳ ಅಂದಾಜುಗಳನ್ನು ಪ್ರತಿನಿಧಿಸುತ್ತವೆ. ರಸ್ತೆ ನಕ್ಷೆಗಳು ಅಥವಾ ಗಡಿಗಳಲ್ಲಿನ ವ್ಯತ್ಯಾಸಗಳನ್ನು ಅಧಿಕೃತ ಮುನ್ಸಿಪಲ್ ದಾಖಲೆಗಳನ್ನು ಬಳಸಿ ಬಗೆಹರಿಸಿಕೊಳ್ಳಬೇಕು.
</p> </section> <section class="space-y-2"> <h2 class="text-sm font-bold text-ink-deep"> <span class="lang-en">4. No Legal Liability</span> <span class="lang-kn">4. ಯಾವುದೇ ಕಾನೂನು ಹೊಣೆಗಾರಿಕೆ ಇಲ್ಲ</span> </h2> <p class="lang-en">
The Government of Karnataka and the Karnataka State Police Command Centre decline all liability for errors, processing offsets, or procedural delays caused by reliance on KSP-ConAI's automated intelligence feeds.
</p> <p class="lang-kn">
KSP-ConAI ನ ಸ್ವಯಂಚಾಲಿತ ಗುಪ್ತಚರ ಮಾಹಿತಿಯ ಮೇಲಿನ ಅವಲಂಬನೆಯಿಂದ ಉಂಟಾಗುವ ತಪ್ಪುಗಳು, ವಿಳಂಬಗಳು ಅಥವಾ ಕಾರ್ಯವಿಧಾನದ ವ್ಯತ್ಯಾಸಗಳಿಗೆ ಕರ್ನಾಟಕ ಸರ್ಕಾರ ಮತ್ತು ಕರ್ನಾಟಕ ರಾಜ್ಯ ಪೊಲೀಸ್ ನಿಯಂತ್ರಣ ಕೊಠಡಿ ಯಾವುದೇ ಜವಾಬ್ದಾರಿಯನ್ನು ಹೊರುವುದಿಲ್ಲ.
</p> </section> </div> <div class="border-t border-hairline-soft pt-4 flex justify-between items-center text-[10px] text-stone"> <span>KSP-ConAI Protocol V1.0</span> <button onclick="window.print()" class="text-primary hover:underline font-bold cursor-pointer"> <span class="lang-en">Print Document</span> <span class="lang-kn">ದಾಖಲೆಯನ್ನು ಪ್ರಿಂಟ್ ಮಾಡಿ</span> </button> </div> </div> </div>  </main> <astro-island uid="1zEeUU" component-url="/app/_astro/Footer.CsLG0tcb.js" component-export="default" renderer-url="/app/_astro/client.CyFoGSjk.js" props="{}" ssr="" client="only" opts="{&quot;name&quot;:&quot;Footer&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></template><!--astro:end--></astro-island> </body></html>
